<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>El Jefe - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gold: #D4AF37; --gold-light: #F4D03F; --black: #0a0a0a;
            --dark-gray: #1a1a1a; --medium-gray: #2a2a2a; --light-gray: #888;
            --white: #ffffff; --danger: #ff4444; --success: #00C851; --blue: #0088cc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--black) 0%, var(--dark-gray) 50%, var(--black) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 10000; }
        .login-box { width: 100%; max-width: 400px; background: var(--dark-gray); border-radius: 20px; padding: 40px 30px; border: 1px solid var(--medium-gray); }
        .login-logo { width: 100px; height: 100px; margin: 0 auto 30px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .login-title { text-align: center; color: var(--gold); font-size: 24px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .form-group input { width: 100%; background: var(--medium-gray); border: 1px solid var(--medium-gray); color: var(--white); padding: 16px 15px; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: var(--gold); }
        .login-btn { width: 100%; background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%); color: var(--black); border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .login-error { color: var(--danger); text-align: center; margin-top: 15px; font-size: 14px; display: none; }

        .admin-panel { display: none; padding-bottom: 100px; }
        .admin-header { background: var(--dark-gray); padding: 20px; border-bottom: 1px solid var(--medium-gray); position: sticky; top: 0; z-index: 100; }
        .admin-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .admin-title { color: var(--gold); font-size: 20px; font-weight: 700; }
        .logout-btn { background: var(--danger); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        
        .main-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .main-tab { background: var(--medium-gray); color: var(--white); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; flex: 1; }
        .main-tab.active { background: var(--gold); color: var(--black); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .stats-bar { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; margin: 20px; }
        .stat-box { background: var(--medium-gray); padding: 15px 20px; border-radius: 10px; min-width: 120px; text-align: center; border: 1px solid var(--dark-gray); }
        .stat-number { color: var(--gold); font-size: 24px; font-weight: 700; }
        .stat-label { color: var(--light-gray); font-size: 12px; margin-top: 5px; }

        .actions-bar { padding: 0 20px 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-primary { background: var(--gold); color: var(--black); border: none; padding: 15px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-secondary { background: var(--medium-gray); color: var(--white); border: 1px solid var(--gold); padding: 15px 25px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px; }

        .products-container { padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .product-card { background: var(--dark-gray); border-radius: 15px; overflow: hidden; border: 1px solid var(--medium-gray); position: relative; }
        .product-img { width: 100%; height: 120px; object-fit: cover; background: var(--medium-gray); }
        .product-info { padding: 12px; }
        .product-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-price { color: var(--gold); font-size: 16px; font-weight: 700; }
        .product-actions { display: flex; gap: 5px; padding: 0 12px 12px; }
        .btn-edit, .btn-delete { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-edit { background: var(--blue); color: white; }
        .btn-delete { background: var(--danger); color: white; }

        .api-settings-card { background: var(--dark-gray); border-radius: 15px; padding: 30px; margin: 20px; border: 1px solid var(--medium-gray); }
        .api-settings-card h3 { color: var(--gold); margin-bottom: 20px; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--success); color: white; padding: 15px 30px; border-radius: 30px; font-weight: 600; z-index: 10001; transition: transform 0.3s ease; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.visible { display: flex; }
        .modal-content { background: var(--dark-gray); border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--medium-gray); display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; color: var(--light-gray); font-size: 28px; cursor: pointer; }
        .modal-body { padding: 20px; }
        .form-row { margin-bottom: 20px; }
        .form-row label { display: block; color: var(--gold); font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
        .form-row input, .form-row select, .form-row textarea { width: 100%; background: var(--medium-gray); border: 1px solid var(--medium-gray); color: var(--white); padding: 15px; border-radius: 10px; font-size: 16px; outline: none; }
        .modal-footer { padding: 20px; display: flex; gap: 10px; }
        .code-block { background: var(--black); border-radius: 10px; padding: 15px; font-family: monospace; font-size: 11px; color: var(--light-gray); max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <div class="login-logo">🔐</div>
            <h1 class="login-title">Admin Access</h1>
            <div class="form-group"><label>Username</label><input type="text" id="username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="password"></div>
            <button class="login-btn" onclick="login()">LOGIN</button>
            <div class="login-error" id="loginError">Accesso negato!</div>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <div class="admin-header-top">
                <div class="admin-title">🛠️ El Jefe Admin</div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
            <div class="main-tabs">
                <button class="main-tab active" onclick="switchTab('catalogTab', this)">📦 Catalogo</button>
                <button class="main-tab" onclick="switchTab('settingsTab', this)">⚙️ Impostazioni API</button>
            </div>
        </div>

        <!-- SCHEDA CATALOGO -->
        <div id="catalogTab" class="tab-content active">
            <div class="stats-bar">
                <div class="stat-box"><div class="stat-number" id="totalProducts">0</div><div class="stat-label">Prodotti</div></div>
                <div class="stat-box"><div class="stat-number" id="avgPrice">0€</div><div class="stat-label">Prezzo Medio</div></div>
            </div>

            <div class="actions-bar">
                <button class="btn-primary" onclick="openAddModal()">➕ Nuovo</button>
                <button class="btn-secondary" onclick="openExportModal()">📋 JS</button>
            </div>

            <div class="products-container">
                <div class="products-grid" id="productsGrid"></div>
            </div>
        </div>

        <!-- SCHEDA IMPOSTAZIONI API -->
        <div id="settingsTab" class="tab-content">
            <div class="api-settings-card">
                <h3>Credenziali di Sistema</h3>
                <p style="font-size: 13px; color: var(--light-gray); margin-bottom: 20px;">
                    Compila questi campi per generare il file di configurazione vitale per il checkout e le notifiche Telegram.
                </p>
                <div class="form-row">
                    <label>Paymento Secret API-Key</label>
                    <input type="text" id="apiPaymento" placeholder="Es: MzEyRDI1...">
                </div>
                <div class="form-row">
                    <label>Telegram Bot Token (Da BotFather)</label>
                    <input type="text" id="apiBot" placeholder="Es: 8657521478:AAEtwCx...">
                </div>
                <div class="form-row">
                    <label>Telegram Group ID (Ricezione Ordini)</label>
                    <input type="text" id="apiChatId" placeholder="Es: -1004302605412">
                </div>
                <button class="btn-primary" style="width: 100%; justify-content: center; margin-top: 15px;" onclick="exportConfigPhp()">
                    💾 Esporta config.php
                </button>
            </div>
        </div>
    </div>

    <!-- MODALS E SCRIPT JS (Stessi dell'originale con aggiunta exportConfigPhp) -->
    <div class="toast" id="toast">Operazione completata!</div>
    
    <!-- Modale Aggiungi -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title" id="modalTitle">Prodotto</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="editProductId">
                <div class="form-row"><label>Nome</label><input type="text" id="productName"></div>
                <div class="form-row"><label>Categoria</label><select id="productCategory"><option value="special">Special</option><option value="weed">Weed</option><option value="vape">Vape</option><option value="hash">Hash</option><option value="mushrooms">Mushrooms</option><option value="prerolls">Prerolls</option><option value="edibles">Edibles</option></select></div>
                <div class="form-row"><label>Prezzo</label><input type="number" id="productPrice" step="0.01"></div>
                <div class="form-row"><label>Immagine (URL)</label><input type="text" id="productImage"></div>
                <div class="form-row"><label>Descrizione EN</label><textarea id="descEN"></textarea></div>
            </div>
            <div class="modal-footer"><button class="btn-primary" style="width:100%; justify-content:center;" onclick="saveProduct()">Salva</button></div>
        </div>
    </div>

    <!-- Modale Esporta JS -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title">📋 Codice JS</h2><button class="modal-close" onclick="closeExportModal()">&times;</button></div>
            <div class="modal-body"><div class="code-block" id="exportCode"></div><button class="btn-primary" style="width:100%; justify-content:center; margin-top:15px;" onclick="copyToClipboard()">Copia negli Appunti</button></div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('eljefe_products')) || [];
        
        // Load saved API settings if present
        window.onload = () => {
            const cfg = JSON.parse(localStorage.getItem('eljefe_api_cfg') || '{}');
            if(cfg.paymento) document.getElementById('apiPaymento').value = cfg.paymento;
            if(cfg.bot) document.getElementById('apiBot').value = cfg.bot;
            if(cfg.chat) document.getElementById('apiChatId').value = cfg.chat;
        };

        function login() {
            if (document.getElementById('username').value === 'root' && document.getElementById('password').value === 'Ciaociao10!') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderProducts();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            document.getElementById('totalProducts').textContent = products.length;
            let avg = products.length > 0 ? (products.reduce((a,b)=>a+b.price,0)/products.length).toFixed(1) : 0;
            document.getElementById('avgPrice').textContent = '€'+avg;

            products.forEach(p => {
                grid.innerHTML += `<div class="product-card"><img src="${p.image}" class="product-img"><div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">€${p.price}</div></div><div class="product-actions"><button class="btn-edit" onclick="editProduct(${p.id})">Modifica</button><button class="btn-delete" onclick="deleteProduct(${p.id})">Elimina</button></div></div>`;
            });
        }

        function openAddModal() {
            document.getElementById('editProductId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('descEN').value = '';
            document.getElementById('productModal').classList.add('visible');
        }

        function editProduct(id) {
            const p = products.find(x => x.id === id);
            document.getElementById('editProductId').value = p.id;
            document.getElementById('productName').value = p.name;
            document.getElementById('productCategory').value = p.category;
            document.getElementById('productPrice').value = p.price;
            document.getElementById('productImage').value = p.image;
            document.getElementById('descEN').value = p.descEN || p.desc || '';
            document.getElementById('productModal').classList.add('visible');
        }

        function closeModal() { document.getElementById('productModal').classList.remove('visible'); }

        function saveProduct() {
            const id = document.getElementById('editProductId').value;
            const p = {
                id: id ? parseInt(id) : (products.length ? Math.max(...products.map(x=>x.id))+1 : 1),
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                image: document.getElementById('productImage').value,
                descEN: document.getElementById('descEN').value
            };
            if(id) {
                products[products.findIndex(x=>x.id==id)] = p;
            } else {
                products.push(p);
            }
            localStorage.setItem('eljefe_products', JSON.stringify(products));
            renderProducts(); closeModal(); showToast('Prodotto salvato!');
        }

        function deleteProduct(id) {
            if(confirm('Eliminare?')) {
                products = products.filter(x => x.id !== id);
                localStorage.setItem('eljefe_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function openExportModal() {
            let code = 'const products = [\n';
            products.forEach(p => { code += `  { id: ${p.id}, name: "${p.name}", category: "${p.category}", price: ${p.price}, image: "${p.image}", desc: "${p.descEN || ''}" },\n`; });
            code += '];';
            document.getElementById('exportCode').textContent = code;
            document.getElementById('exportModal').classList.add('visible');
        }

        function closeExportModal() { document.getElementById('exportModal').classList.remove('visible'); }
        function copyToClipboard() { navigator.clipboard.writeText(document.getElementById('exportCode').textContent); showToast('Copiato!'); }

        // NOVITÀ: Esporta il file config.php
        function exportConfigPhp() {
            const pKey = document.getElementById('apiPaymento').value.trim();
            const bTok = document.getElementById('apiBot').value.trim();
            const cId = document.getElementById('apiChatId').value.trim();

            if(!pKey || !bTok || !cId) {
                alert("Compila tutti i campi prima di esportare!");
                return;
            }

            // Salva nel browser per la prossima volta
            localStorage.setItem('eljefe_api_cfg', JSON.stringify({paymento: pKey, bot: bTok, chat: cId}));

            const phpContent = `<?php\n// File generato automaticamente da Admin Panel\ndefine('PAYMENTO_API_KEY', '${pKey}');\ndefine('BOT_TOKEN', '${bTok}');\ndefine('CHAT_ID', '${cId}');\n?>`;
            
            const blob = new Blob([phpContent], { type: "application/x-httpd-php" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "config.php";
            link.click();
            
            showToast('✅ config.php generato!');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
